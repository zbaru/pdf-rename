name: Build Offline PDF Renamer EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
    - name: 코드 가져오기
      uses: actions/checkout@v4

    - name: Python 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 오프라인 실행파일(.exe) 빌드
      run: |
        pyinstaller --noconsole --onefile --collect-all rapidocr_onnxruntime --name "PDF_OCR_Renamer" main.py

    - name: 완성된 EXE 파일 업로드
      uses: actions/upload-artifact@v4
      with:
        name: PDF_OCR_Renamer_Windows
        path: dist/PDF_OCR_Renamer.exe
